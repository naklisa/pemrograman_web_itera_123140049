<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 2 - Perulangan, Fungsi & Event Handler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
    .header h1 { font-size: 1.8rem; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }
    .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--primary); font-weight: 600; margin-bottom: 1rem; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #1e293b; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 0.35rem; color: #334155; }
    input { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    button { background: var(--primary); color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { background: var(--primary-hover); }
    .result-box { margin-top: 1rem; padding: 1rem; background: #f1f5f9; border-radius: 8px; font-family: monospace; font-size: 0.95rem; max-height: 250px; overflow-y: auto; white-space: pre-wrap; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu Modul</a>
    <div class="header">
      <h1><i class="fa-solid fa-repeat"></i> Latihan 2: Perulangan, Fungsi & Event Handler</h1>
      <p>Praktikum PAW Pertemuan 1 - Nahli Saud Ramdani (123140049)</p>
    </div>

    <!-- 1. Tabel Perkalian -->
    <div class="card">
      <h2><i class="fa-solid fa-table-cells"></i> 1. Tabel Perkalian (1 - 10)</h2>
      <div class="form-group">
        <label for="angkaPerkalian">Pilih Angka Perkalian:</label>
        <input type="number" id="angkaPerkalian" value="7" min="1" max="100">
      </div>
      <button onclick="tampilkanPerkalianUI()">Generate Tabel Perkalian</button>
      <div id="perkalianResult" class="result-box"></div>
    </div>

    <!-- 2. Hitung Faktorial -->
    <div class="card">
      <h2><i class="fa-solid fa-square-root-variable"></i> 2. Hitung Faktorial (n!)</h2>
      <div class="form-group">
        <label for="angkaFaktorial">Masukkan Angka (0-20):</label>
        <input type="number" id="angkaFaktorial" value="5" min="0" max="20">
      </div>
      <button onclick="hitungFaktorialUI()">Hitung Faktorial</button>
      <div id="faktorialResult" class="result-box"></div>
    </div>

    <!-- 3. Cek Bilangan Prima -->
    <div class="card">
      <h2><i class="fa-solid fa-hashtag"></i> 3. Cek Bilangan Prima</h2>
      <div class="form-group">
        <label for="angkaPrima">Masukkan Angka Bulat:</label>
        <input type="number" id="angkaPrima" value="29" min="1">
      </div>
      <button onclick="cekPrimaUI()">Cek Bilangan Prima</button>
      <div id="primaResult" class="result-box"></div>
    </div>

    <!-- 4. Kalkulator BMI -->
    <div class="card">
      <h2><i class="fa-solid fa-weight-scale"></i> 4. Kalkulator Body Mass Index (BMI)</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="beratBMI">Berat Badan (kg):</label>
          <input type="number" id="beratBMI" value="65" min="1" step="0.1">
        </div>
        <div class="form-group">
          <label for="tinggiBMI">Tinggi Badan (cm):</label>
          <input type="number" id="tinggiBMI" value="170" min="1" step="1">
        </div>
      </div>
      <button id="btnHitungBMI">Hitung BMI</button>
      <div id="bmiResult" class="result-box"></div>
    </div>

    <!-- 5. Program FizzBuzz -->
    <div class="card">
      <h2><i class="fa-solid fa-fire"></i> 5. Program FizzBuzz (1 - 100)</h2>
      <button onclick="jalankanFizzBuzzUI()">Jalankan FizzBuzz</button>
      <div id="fizzbuzzResult" class="result-box"></div>
    </div>

  </div>

  <script src="latihan2.js"></script>
</body>
</html>
